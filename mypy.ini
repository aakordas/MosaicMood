[mypy]
# Strict type checking configuration for MosaicMood - focus on source files

# Enable strict mode
strict = True

# Python version
python_version = 3.12

# Import handling
follow_imports = normal
follow_imports_for_stubs = True
ignore_missing_imports = False

# Warnings
warn_redundant_casts = False
warn_unused_configs = False
warn_unreachable = False

# Exclude tests - they have mocking which mypy struggles with
[mypy-tests.*]
ignore_errors = True

# Per-module options: allow Any in image processing due to NumPy/OpenCV typing limitations
[mypy-image_ops]
disallow_any_expr = False
disallow_incomplete_defs = False

[mypy-video_ops]
disallow_any_expr = False
disallow_incomplete_defs = False

[mypy-gui]
disallow_any_expr = False
disallow_incomplete_defs = False
